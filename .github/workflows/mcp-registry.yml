# Publishing to the official MCP Registry used to need a device-code login every ~30 min.
# GitHub Actions can prove the repository identity with OIDC instead, so a release is enough.
# generated by dsh-signoff -- remove with: signoff uninstall
name: mcp-registry
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: |
          curl -fsSL -o mcp-publisher.tar.gz https://github.com/modelcontextprotocol/registry/releases/download/v1.8.8/mcp-publisher_linux_amd64.tar.gz
          tar xzf mcp-publisher.tar.gz mcp-publisher
          sudo install -m 0755 mcp-publisher /usr/local/bin/mcp-publisher
      - name: Authenticate and publish
        # The registry occasionally refuses connections from cloud egress; one refusal is
        # not a reason to leave a release unpublished by hand.
        run: |
          for attempt in 1 2 3; do
            if mcp-publisher login github-oidc && mcp-publisher publish; then
              exit 0
            fi
            echo "attempt $attempt failed; retrying in 20s" >&2
            sleep 20
          done
          exit 1
