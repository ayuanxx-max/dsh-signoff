# generated by dsh-signoff -- remove with: signoff uninstall
name: signoff
on: [push, pull_request]
jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: npx --yes dsh-signoff@latest guard --ci
      - name: audit trailers
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: |
          BASE="${GITHUB_EVENT_BEFORE}"; if [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null; then BASE=$(git rev-parse HEAD~1 2>/dev/null || true); fi; if [ -n "$BASE" ]; then npx --yes dsh-signoff@latest audit --range "$BASE..HEAD"; fi
